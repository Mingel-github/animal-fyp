name: meowagenet-repro
channels:
  - conda-forge
dependencies:
  # Versions reported in Table 6 of the paper.
  - python=3.10.12
  - ffmpeg
  - pip
  - pip:
      - tensorflow==2.15.0
      - numpy==1.25.2
      - pandas==1.5.3

      # The upstream repository imports these packages but does not pin them.
      # These versions are compatible with Python 3.10 and TensorFlow 2.15.
      - scipy==1.11.4
      - scikit-learn==1.3.2
      - imbalanced-learn==0.11.0
      - matplotlib==3.8.2
      - seaborn==0.13.0
      - optuna==3.5.0
      - audiomentations==0.34.1
      - jupyterlab==4.0.9
      - ipykernel==6.27.1

      # CUDA-enabled AST dependencies for the RTX 4060 Ti rerun.
      # The original 2026-08-25 pilot used the CPU-only builds; this recipe was
      # corrected on 2026-08-26 after the NVIDIA GPU was re-audited.
      - --extra-index-url=https://download.pytorch.org/whl/cu121
      - torch==2.2.2+cu121
      - torchaudio==2.2.2+cu121
      - transformers==4.48.3
      - huggingface-hub==0.28.1
      - safetensors==0.5.2
      - pytest==7.4.3
